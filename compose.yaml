services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: public_intelligence
      POSTGRES_PASSWORD: public_intelligence
      POSTGRES_USER: public_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U public_intelligence -d public_intelligence
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
