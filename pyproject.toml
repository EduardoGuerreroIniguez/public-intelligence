[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "public-intelligence"
version = "0.1.0"
description = "Transform public information into structured business intelligence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_unused_configs = true
